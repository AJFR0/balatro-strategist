name: engine-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Run engine tests (28 verified against known game math)
        run: python tests/test_engine.py
      - name: Data audit (tables vs balatrowiki.org extract, engine vs wiki numbers)
        run: python tests/test_data.py
      - name: Spoken-hand parser (cardspeech.js — homophones, suit grammar, modifiers)
        run: node tests/test_cardspeech.js
